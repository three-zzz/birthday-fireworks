<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韩晓宇生日快乐</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #060a1f; }
  canvas { display: block; }
  #tip {
    position: fixed; bottom: 18px; width: 100%; text-align: center;
    color: rgba(255,255,255,.55); font-size: 14px; letter-spacing: 2px;
    font-family: "Microsoft YaHei", sans-serif; pointer-events: none;
    animation: fade 3s ease-in-out infinite alternate;
  }
  @keyframes fade { from { opacity: .3; } to { opacity: .9; } }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="tip">点击屏幕任意位置，再放一朵烟花 ✨</div>
<script>
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; buildTextParticles(); }
addEventListener('resize', resize);

/* ---------- 背景：星星 / 月亮 ---------- */
const bgStars = Array.from({length: 160}, () => ({
  x: Math.random(), y: Math.random() * 0.65,
  r: Math.random() * 1.4 + 0.3,
  tw: Math.random() * Math.PI * 2
}));

function drawBackground(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#05081c');
  g.addColorStop(0.6, '#0a1030');
  g.addColorStop(1, '#141a3e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 闪烁小星星
  for (const s of bgStars) {
    const a = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.001 + s.tw));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 月亮
  const mx = W * 0.82, my = H * 0.18, mr = Math.min(W, H) * 0.055;
  const halo = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 4);
  halo.addColorStop(0, 'rgba(255, 240, 190, 0.35)');
  halo.addColorStop(1, 'rgba(255, 240, 190, 0)');
  ctx.fillStyle = halo;
  ctx.fillRect(mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
  const moon = ctx.createRadialGradient(mx - mr*0.3, my - mr*0.3, mr*0.2, mx, my, mr);
  moon.addColorStop(0, '#fff8dc');
  moon.addColorStop(1, '#f5d76e');
  ctx.fillStyle = moon;
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
}

function drawCity() {
  // 简易城市剪影
  ctx.fillStyle = '#0a0e24';
  let x = 0; const base = H;
  let seed = 7;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  while (x < W) {
    const w = 30 + rand() * 70;
    const h = 40 + rand() * 110;
    ctx.fillRect(x, base - h, w, h);
    // 窗户
    ctx.fillStyle = 'rgba(255, 220, 130, 0.35)';
    for (let wy = base - h + 8; wy < base - 10; wy += 16)
      for (let wx = x + 6; wx < x + w - 8; wx += 14)
        if (rand() > 0.6) ctx.fillRect(wx, wy, 4, 6);
    ctx.fillStyle = '#0a0e24';
    x += w + 4 + rand() * 10;
  }
}

/* ---------- 星星文字：把文字采样成粒子点 ---------- */
const MSG = '韩晓宇生日快乐';
let textParticles = [];
let textSize = 0;

resize(); // 初始化画布尺寸并构建星星文字

function buildTextParticles() {
  textParticles = [];
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const octx = off.getContext('2d');
  const size = Math.min(W / (MSG.length * 1.3), H * 0.15);
  octx.font = `bold ${size}px "Microsoft YaHei", sans-serif`;
  octx.textAlign = 'center';
  octx.textBaseline = 'middle';
  octx.fillStyle = '#fff';
  octx.fillText(MSG, W / 2, H * 0.42);
  // 记录文字区域，用于柔光底衬
  textSize = size;
  const data = octx.getImageData(0, 0, W, H).data;
  const gap = 4; // 采样间距，越小星星越密
  for (let y = 0; y < H; y += gap) {
    for (let x = 0; x < W; x += gap) {
      if (data[(y * W + x) * 4 + 3] > 128) {
        textParticles.push({
          x, y,
          ox: x, oy: y,
          phase: Math.random() * Math.PI * 2,
          r: 1.1 + Math.random() * 1.2,
          // 统一暖金白系，个别偏粉，保证整体清晰
          hue: Math.random() < 0.85 ? 42 + Math.random() * 10 : 350 + Math.random() * 15,
          sat: Math.random() < 0.5 ? 100 : 30, // 一半近白色，降低花哨感
          star: Math.random() < 0.12 // 仅 12% 的星星带十字光芒
        });
      }
    }
  }
}

function drawText(t) {
  const cy = H * 0.42;
  // 1) 真实字形骨架：柔和发光文字保证可读性
  if (textSize) {
    ctx.save();
    ctx.font = `bold ${textSize}px "Microsoft YaHei", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // 外层光晕
    ctx.shadowColor = 'rgba(255, 200, 90, 0.9)';
    ctx.shadowBlur = 28;
    ctx.fillStyle = 'rgba(255, 236, 170, 0.28)';
    ctx.fillText(MSG, W / 2, cy);
    // 内层字形（更实、更亮）
    ctx.shadowColor = 'rgba(255, 240, 200, 0.8)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = 'rgba(255, 246, 214, 0.55)';
    ctx.fillText(MSG, W / 2, cy);
    ctx.restore();
    // 2) 柔光底衬：文字后方一圈暖光
    const glow = ctx.createRadialGradient(W / 2, cy, textSize * 0.2, W / 2, cy, textSize * 2.2);
    glow.addColorStop(0, 'rgba(255, 214, 120, 0.16)');
    glow.addColorStop(0.5, 'rgba(255, 190, 100, 0.07)');
    glow.addColorStop(1, 'rgba(255, 190, 100, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
  }
  // 3) 星星点缀：叠在字形上，制造星星点点效果
  for (const p of textParticles) {
    const dx = Math.sin(t * 0.0012 + p.phase) * 1.5;
    const dy = Math.cos(t * 0.0014 + p.phase) * 1.2;
    const a = 0.82 + 0.18 * Math.sin(t * 0.0025 + p.phase * 2); // 轻微呼吸
    ctx.globalAlpha = a;
    ctx.fillStyle = `hsl(${p.hue}, ${p.sat}%, ${p.sat > 50 ? 70 : 92}%)`;
    ctx.beginPath();
    ctx.arc(p.x + dx, p.y + dy, p.r, 0, Math.PI * 2);
    ctx.fill();
    // 少量星光十字点缀
    if (p.star) {
      ctx.globalAlpha = a * 0.55;
      ctx.strokeStyle = `hsl(${p.hue}, ${p.sat}%, 85%)`;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(p.x + dx - p.r * 3.5, p.y + dy); ctx.lineTo(p.x + dx + p.r * 3.5, p.y + dy);
      ctx.moveTo(p.x + dx, p.y + dy - p.r * 3.5); ctx.lineTo(p.x + dx, p.y + dy + p.r * 3.5);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

/* ---------- 烟花粒子 ---------- */
const rockets = [];
const sparks = [];
const PALETTES = [
  ['#ffd166', '#ff9e64', '#fff3c4'],          // 暖金橙
  ['#ff6ec7', '#ffa6e0', '#ffd9f5'],          // 粉色系
  ['#6ef3e0', '#9bf6ff', '#e0fbfc'],          // 青色系
  ['#c084fc', '#e9d5ff', '#f0abfc'],          // 紫色系
  ['#7dd3fc', '#a5f3fc', '#ffffff'],          // 冰蓝白
  ['#fde047', '#fb7185', '#ffffff']           // 金红撞色
];

function launch(tx, ty, front) {
  const palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
  rockets.push({
    x: tx ?? W * (0.15 + Math.random() * 0.7),
    y: H, ty: ty ?? H * (0.08 + Math.random() * 0.42), // 高度范围：文字上方到文字下方
    vy: -(4.2 + Math.random() * 1.8), palette,
    front: front ?? Math.random() < 0.3, // 30% 在文字前景炸开
    trail: []
  });
}

function explode(x, y, palette, front) {
  const n = 160 + Math.floor(Math.random() * 80);
  const twoLayer = Math.random() > 0.5; // 双层球更像参考图
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i) / n + Math.random() * 0.2;
    const speed = (twoLayer && i % 2 ? 3.4 : 6.2) + Math.random() * 2.5;
    sparks.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1, decay: 0.005 + Math.random() * 0.007,
      color: palette[Math.floor(Math.random() * palette.length)],
      size: 1.8 + Math.random() * 2.2, trail: [],
      front
    });
  }
}

function stepFireworks(front) {
  // 上升的火箭
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    if (r.front !== front) continue;
    r.y += r.vy;
    r.vy *= 0.985;
    r.trail.push({x: r.x, y: r.y});
    if (r.trail.length > 18) r.trail.shift();
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = '#ffe9b0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    r.trail.forEach((p, j) => j ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.stroke();
    if (r.y <= r.ty || r.vy > -1) { explode(r.x, r.y, r.palette, r.front); rockets.splice(i, 1); }
  }
  // 炸开的火星
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    if (s.front !== front) continue;
    s.trail.push({x: s.x, y: s.y});
    if (s.trail.length > 7) s.trail.shift();
    s.x += s.vx; s.y += s.vy;
    s.vx *= 0.972; s.vy = s.vy * 0.972 + 0.03; // 阻力+重力，参考图的下坠拖尾感
    s.life -= s.decay;
    ctx.globalAlpha = Math.max(s.life, 0);
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.size;
    ctx.beginPath();
    s.trail.forEach((p, j) => j ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.stroke();
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size * 0.8, 0, Math.PI * 2); ctx.fill();
    if (s.life <= 0) sparks.splice(i, 1);
  }
  ctx.globalAlpha = 1;
}

/* ---------- 主循环 ---------- */
let last = 0;
function loop(t) {
  ctx.fillStyle = 'rgba(5, 8, 28, 0.35)'; // 半透明覆盖制造拖尾
  ctx.fillRect(0, 0, W, H);
  drawBackground(t);
  stepFireworks(false); // 后景烟花：在文字后面炸开
  drawText(t);
  stepFireworks(true);  // 前景烟花：升到文字上方/飘到文字前面
  drawCity();
  // 自动放烟花：节奏放慢，一次 2~3 朵
  if (t - last > 1100 + Math.random() * 900) {
    const n = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < n; i++) setTimeout(() => launch(), i * 300);
    last = t;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- 交互 ---------- */
addEventListener('pointerdown', e => {
  launch(e.clientX, e.clientY * (0.3 + Math.random() * 0.5));
  if (sparks.length > 3000) sparks.splice(0, sparks.length - 3000);
});

// 开场连放八朵，高度错落：有的在文字上方，有的在文字后面
[300, 600, 900, 1300, 1700, 2200, 2800, 3400].forEach((d, i) =>
  setTimeout(() => launch(W * (0.12 + (i % 6) * 0.15), H * (0.1 + (i % 4) * 0.11), i % 3 === 0), d)
);
</script>
</body>
</html>
